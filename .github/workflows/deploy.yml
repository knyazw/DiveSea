# .github/workflows/deploy.yml
name: Deploy Main folder to Pages

on:
  push:
    branches: ["main"]  # Запускать при пушах в main
  workflow_dispatch:   # Позволяет запустить вручную

# Разрешить деплой
permissions:
  contents: read
  pages: write
  id-token: write

# Не запускать несколько деплоев одновременно
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # КЛЮЧЕВОЙ МОМЕНТ: указываем вашу папку Main
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'Main'   # <-- Здесь имя вашей папки

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
